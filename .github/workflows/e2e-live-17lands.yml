name: E2E (17Lands API)

# The 17Lands API is NOT officially public, so this is deliberately the rarest
# job in the repo: once a week, two requests, no browser. It exists only to
# notice if the response shape the overlay parses has changed.
on:
  # Six scattered slots across the week; a guard step picks exactly one, derived
  # from the week number. The hit lands at a different time each week without
  # the job sleeping on a runner to achieve it.
  schedule:
    - cron: '17 14 * * 1'
    - cron: '43 18 * * 2'
    - cron: '29 22 * * 3'
    - cron: '51 2 * * 5'
    - cron: '13 6 * * 6'
    - cron: '37 10 * * 0'
  workflow_dispatch:

concurrency:
  group: e2e-live-17lands
  cancel-in-progress: false

jobs:
  seventeen-lands:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Pick one slot for this week
        id: guard
        run: node .github/scripts/schedule-guard.mjs weekly 6

      - uses: actions/setup-node@v7
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.guard.outputs.run == 'true'

      - run: npx playwright test --config playwright.config.mjs --project live-17lands
        if: steps.guard.outputs.run == 'true'
