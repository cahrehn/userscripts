name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # npm ci installs exactly what package-lock.json pins and fails if the
      # lockfile is out of sync with package.json.
      - run: npm ci

      # Runs the suite and collects coverage in one pass.
      - run: npm run coverage

      # Renders the coverage table onto the run page and the PR's checks tab.
      # `if: always()` so the numbers still appear when a test fails - that is
      # exactly when you want to see what is and is not covered.
      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs

      # Keeps the lcov + HTML report for download, and gives a later e2e job
      # something to merge its own coverage with.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      # Catches a syntax error in the userscript even if no test imports the
      # affected code path.
      - name: Check userscript parses
        run: node --check mtg-draft-gih-wr-overlay.js
